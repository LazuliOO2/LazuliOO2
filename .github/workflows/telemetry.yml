name: Refresh public GitHub telemetry
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public metrics and render local panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_telemetry.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry.json assets/github-telemetry.svg assets/github-telemetry-mobile.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update public GitHub telemetry snapshot'
            git push
          fi
